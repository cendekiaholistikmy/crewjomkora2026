<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JOMKORA 2026 Crew</title>
<meta name="description" content="Senarai rasmi krew JOMKORA 2026 dan skop tugas setiap jawatan. GengVolunteers 2.0 × HeartSpace.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A2219">
<link rel="icon" id="fav" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* JOMKORA look: deep forest green page, cream cards and gold accents, after the official org chart. One look on every device. */
:root{
  --bg:#0A2219; --bg2:#0F3324; --bg3:#164530; --cream:#F7EFDB; --cream2:#EEE1C1; --ink:#14301F; --muted:#5E6B57;
  --gold:#C99A3B; --gold2:#E5C373; --line:rgba(20,48,31,.14); --lineD:rgba(229,195,115,.22);
  --t-hc:#B8862B; --t-cr:#1E7A6A; --t-hq:#2F6B3C; --t-g7:#6B4E9B; --t-hs:#B4413A;
  --serif:"Fraunces",Georgia,serif; --sans:"Plus Jakarta Sans","Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#1B5238 0%,var(--bg) 60%) fixed,var(--bg);color:var(--cream);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 18px}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(10,34,25,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--lineD)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:9px;padding-bottom:9px}
.top img{height:34px;width:auto}
.top b{font-family:var(--serif);font-size:17px;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--lineD);background:transparent;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--cream2)}
.tab[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1B1305}
.btn{border:1px solid var(--lineD);background:var(--bg2);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--cream)}
.btn:hover{border-color:var(--gold2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1B1305}
.btn.ghost{background:transparent}
.btn.danger{border-color:#e59a8f;color:#ffc9c0;background:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.lite{background:#fff;border-color:var(--line);color:var(--ink)}

/* hero */
.hero{text-align:center;padding:28px 0 8px}
.hero img{width:min(420px,82vw);height:auto;filter:drop-shadow(0 12px 30px rgba(0,0,0,.45))}
.kicker{font-size:12.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold2);font-weight:800;margin-top:14px}
.hero h1{font-family:var(--serif);font-weight:800;font-size:clamp(30px,5vw,50px);margin:4px 0 0;letter-spacing:-.01em;line-height:1.1}
.hero .tag-line{color:var(--cream2);margin:8px auto 0;max-width:60ch;font-style:italic;font-family:var(--serif)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:22px 0 0;text-align:left}
.info div{background:rgba(247,239,219,.06);border:1px solid var(--lineD);border-radius:14px;padding:11px 14px}
.info small{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2);font-weight:800}
.info span{display:block;font-weight:600;margin-top:2px}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat{min-width:120px;background:var(--cream);color:var(--ink);border-radius:14px;padding:10px 16px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:26px;line-height:1}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}

/* search */
.searchbox{position:relative;margin:26px auto 6px;max-width:720px}
.searchbox input{width:100%;background:var(--cream);color:var(--ink);border:2px solid var(--gold);border-radius:16px;padding:15px 18px 15px 48px;font-size:16px;font-weight:600}
.searchbox input::placeholder{color:#8B8A72;font-weight:500}
.searchbox svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.hint{text-align:center;color:var(--cream2);font-size:13px;margin:4px 0 0}
.results{margin:16px auto 0;max-width:900px;display:grid;gap:10px}
.rescount{color:var(--cream2);font-size:13px;font-weight:600}
.pcard{background:var(--cream);color:var(--ink);border-radius:16px;padding:14px 16px;display:grid;gap:8px;border-left:5px solid var(--gold)}
.pcard h3{margin:0;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.asg{display:flex;flex-wrap:wrap;gap:6px}
.asg button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;cursor:pointer;text-align:left;font-size:13px;color:var(--ink)}
.asg button:hover{border-color:var(--gold)}
.asg button b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.empty{color:var(--cream2);font-style:italic;text-align:center;padding:10px}

/* departments */
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:38px 0 14px}
.sechead h2{font-family:var(--serif);font-size:clamp(24px,3.4vw,34px);margin:0}
.sechead p{margin:4px 0 0;color:var(--cream2);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.dept{background:var(--cream);color:var(--ink);border-radius:18px;overflow:hidden;border:2px solid var(--gold);display:flex;flex-direction:column}
.dept header{background:linear-gradient(180deg,#123A28,#0E2F20);color:var(--cream);padding:11px 14px;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--gold)}
.dept header .ic{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#1B1305;display:grid;place-items:center;flex:none}
.dept header h3{margin:0;font-size:14.5px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;line-height:1.25}
.dept .body{padding:10px 12px 12px;display:grid;gap:4px}
.lbl{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 2px 2px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-radius:10px;padding:7px 9px;cursor:pointer;border:1px solid transparent;background:transparent;text-align:left;width:100%;color:var(--ink)}
.row:hover{background:#fff;border-color:var(--line)}
.row.head{background:rgba(201,154,59,.13)}
.nm{font-weight:700}
.tg{font-size:12.5px;color:#1C5E47;font-weight:600;word-break:break-all}
.fl{display:block;font-size:12.5px;color:var(--muted)}
.chev{color:var(--muted);font-size:18px}
.t{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.04em;border-radius:6px;padding:1px 6px;color:#fff;vertical-align:1px}
.t-HC{background:var(--t-hc)}.t-CR{background:var(--t-cr)}.t-HQ{background:var(--t-hq)}.t-G7{background:var(--t-g7)}.t-HS{background:var(--t-hs)}
.adm{display:flex;gap:4px}
.ib{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--ink);display:grid;place-items:center}
.ib:hover{border-color:var(--gold)}
.add{border:1px dashed rgba(20,48,31,.35);background:transparent;border-radius:10px;padding:8px;cursor:pointer;color:var(--muted);font-weight:700;font-size:13px;margin-top:4px}
.add:hover{color:var(--ink);border-color:var(--ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--cream2);font-size:13px}

/* ethics */
.ethics{background:rgba(247,239,219,.06);border:1px solid var(--lineD);border-radius:18px;padding:16px 18px;margin-top:14px}
.ethics ol{margin:0;padding-left:20px;display:grid;gap:6px;text-align:justify}
footer{text-align:center;color:var(--cream2);font-size:12.5px;padding:34px 0 50px}
footer b{font-family:var(--serif);letter-spacing:.3em;color:var(--gold2);font-size:15px;display:block;margin-bottom:6px}

/* drawer and modal */
.scrim{position:fixed;inset:0;background:rgba(3,12,8,.62);z-index:50;display:flex;justify-content:flex-end}
.drawer{width:min(560px,100%);height:100%;overflow:auto;background:var(--cream);color:var(--ink);padding:20px 20px 40px;display:flex;flex-direction:column;gap:14px;box-shadow:-20px 0 50px rgba(0,0,0,.4)}
.drawer .x{margin-left:auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px;color:var(--ink)}
.dtop{display:flex;align-items:center;gap:10px}
.dtop small{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.drawer h2{font-family:var(--serif);font-size:28px;margin:0;line-height:1.15}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;text-decoration:none;color:#1C5E47}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.box h4{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:8px}
.box h4 i{font-style:normal;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.box ul,.box ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px;text-align:justify}
.ph{display:grid;gap:10px;margin-top:8px}
.ph h5{margin:0 0 3px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#8A6418;font-weight:800}
.reports{display:grid;gap:6px}
.reports a,.reports div{font-size:14px}
.modal{width:min(640px,100%);height:100%;overflow:auto;background:var(--cream);color:var(--ink);padding:20px 20px 40px;display:flex;flex-direction:column;gap:12px}
.modal h2{font-family:var(--serif);margin:0;font-size:24px}
.f{display:grid;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;background:#fff;border:1px solid rgba(20,48,31,.25);border-radius:10px;padding:9px 11px;color:var(--ink);font-weight:500;font-size:14.5px}
.f textarea{min-height:96px;resize:vertical;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:grid;gap:4px;max-height:260px;overflow:auto;background:#fff;border:1px solid rgba(20,48,31,.25);border-radius:10px;padding:8px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-weight:500;color:var(--ink);font-size:14px}
.checks .g{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:6px}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

/* admin bar, banner, toast, gate */
.adminbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(15,51,36,.97);border-top:1px solid var(--gold);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.adminbar .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.adminbar span{flex:1;min-width:180px;font-size:13.5px;color:var(--cream2)}
body.admin{padding-bottom:110px}
.banner{background:rgba(229,195,115,.14);border:1px solid rgba(229,195,115,.5);color:var(--cream);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-top:14px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;background:var(--cream);color:var(--ink);font-weight:700;border-radius:12px;padding:10px 16px;box-shadow:0 12px 30px rgba(0,0,0,.35);max-width:calc(100% - 32px);font-size:14px}
.gate{max-width:420px;margin:40px auto;background:var(--cream);color:var(--ink);border-radius:18px;padding:22px;text-align:center;display:grid;gap:10px}
.gate h2{font-family:var(--serif);margin:0}
.loading{text-align:center;color:var(--cream2);padding:60px 0}
@media (max-width:640px){
  .top b{display:none}
  .top img{height:30px}
  .grid{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .drawer h2{font-size:24px}
  .stat{min-width:0;flex:1 1 40%}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

/* ---------- data loading ---------- */
function load(){
  if (!API_URL || API_URL.indexOf('__') === 0) {
    var seed = document.getElementById('seed');
    if (seed) { S = JSON.parse(seed.textContent); demo = true; rev = S.meta.rev || 1; start(); }
    else app.innerHTML = '<div class="gate"><h2>Belum disambungkan</h2><p>Tampal URL Web App Google Apps Script ke dalam API_URL dalam fail ini.</p></div>';
    return;
  }
  var code = ''; try { code = localStorage.getItem(VIEW_LS) || ''; } catch (e) {}
  fetch(API_URL + '?action=get&code=' + encodeURIComponent(code), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(d){
    if (d && d.ok) { S = d.state; rev = d.rev; start(); }
    else if (d && d.error === 'code') gate(code ? 'Kod krew tidak sah. Cuba lagi.' : '');
    else if (d && d.error === 'empty') app.innerHTML = '<div class="gate"><h2>Tiada data lagi</h2><p>Jalankan fungsi seed() dalam Apps Script untuk memuatkan senarai krew awal.</p></div>';
    else app.innerHTML = '<div class="gate"><h2>Gagal memuatkan</h2><p>' + esc(d && d.error || 'Ralat tidak diketahui') + '</p><button class="btn gold" onclick="location.reload()">Cuba lagi</button></div>';
  }).catch(function(){ app.innerHTML = '<div class="gate"><h2>Gagal memuatkan</h2><p>Semak sambungan internet, kemudian cuba lagi.</p><button class="btn gold" onclick="location.reload()">Cuba lagi</button></div>'; });
}
function gate(msg){
  app.innerHTML = '<div class="gate"><img src="' + LOGO + '" alt="JOMKORA 2026" style="width:220px;margin:0 auto"><h2>Krew JOMKORA 2026</h2><p>Masukkan kod krew yang dikongsi dalam grup Telegram krew.</p>' +
    (msg ? '<p style="color:#A33A2C;font-weight:700">' + esc(msg) + '</p>' : '') +
    '<div class="f"><input id="code" type="password" autocomplete="off" placeholder="Kod krew" aria-label="Kod krew"></div><button class="btn gold" id="go" style="justify-content:center">Masuk</button></div>';
  var go = function(){ try { localStorage.setItem(VIEW_LS, document.getElementById('code').value.trim()); } catch (e) {} app.innerHTML = '<p class="loading">Memuatkan…</p>'; load(); };
  document.getElementById('go').onclick = go;
  document.getElementById('code').onkeydown = function(e){ if (e.key === 'Enter') go(); };
}
function start(){
  var hs = (location.hash || '').replace('#',''); var ls = ''; try { ls = localStorage.getItem(SER_LS) || ''; } catch (e) {}
  series = [hs, ls, 'S1'].filter(function(x){ return x && S.series.some(function(s){ return s.id === x; }); })[0] || S.series[0].id;
  var qp = new URLSearchParams(location.search).get('q'); if (qp) q = qp;
  try { var k = sessionStorage.getItem('jomkora_admin'); if (k && !demo) { adminKey = k; admin = true; } } catch (e) {}
  render();
}

  }).catch(function(){ toast('Gagal menghubungi pelayan.'); });
}
function post(body){ return fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)}).then(function(r){ return r.json(); }); }
function save(){

}
